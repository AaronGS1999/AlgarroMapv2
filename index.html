<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
  <title>AlgarroMap</title>
  <meta name="description" content="Mapa de las localizaciones de los árboles de algarrobo muestreados en el proyecto de secuenciación.">
  <link rel="stylesheet" href="vendor/maplibre-gl.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="iconos/Algarrobo_color.png" type="image/png">
</head>
<body>
  <div id="map" aria-label="Mapa de árboles"></div>

  <header class="panel brand" id="brand">
    <h1>AlgarroMap</h1>
    <p class="tagline" data-i18n="tagline">Localización de los algarrobos muestreados por el grupo BIO-359: Genómica Evolutiva de Plantas</p>
    <p class="stats" id="stats"></p>
    <div class="actions">
      <button id="toggleFilters" class="act" aria-expanded="false" aria-controls="controls">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M3 5h18l-7 8v6l-4 2v-8z"/></svg>
        <span data-i18n="filters">Filtros</span>
      </button>
      <button id="toggleMode" class="act" aria-pressed="false" aria-label="Pines" title="Pines individuales">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>
        <span data-i18n="mode">Pines</span>
      </button>
      <button id="toggleGlobe" class="act" aria-pressed="false" aria-label="Globo" title="Vista globo">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18zM3.2 12h17.6M12 3c2.4 2.4 3.7 5.6 3.7 9s-1.3 6.6-3.7 9c-2.4-2.4-3.7-5.6-3.7-9s1.3-6.6 3.7-9z"/></svg>
        <span data-i18n="globe">Globo</span>
      </button>
      <a id="repoLink" class="act" href="https://github.com/AaronGS1999/AlgarroMapv2" target="_blank" rel="noopener" aria-label="GitHub" title="GitHub">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
        <span>GitHub</span>
      </a>
      <div id="hits" class="act hits" hidden>
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path fill="currentColor" d="M12 5C6.5 5 2.7 8.6 1 12c1.7 3.4 5.5 7 11 7s9.3-3.6 11-7c-1.7-3.4-5.5-7-11-7zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-2a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
        <span data-i18n="visits">Visitas</span>
        <span id="hitsCount" class="hits-n"></span>
      </div>
    </div>
  </header>

  <div class="topright">
    <div class="seg" id="lang" role="group" aria-label="Idioma">
      <button data-lang="es" class="on">ES</button>
      <button data-lang="en">EN</button>
    </div>
  </div>

  <aside class="panel controls" id="controls">
    <div class="field">
      <input type="search" id="search" autocomplete="off" data-i18n-ph="search_ph" placeholder="Buscar por nombre o código…">
    </div>
    <div class="group">
      <div class="group-head">
        <span data-i18n="f_country">País / región</span>
        <button class="link" data-clear="country" data-i18n="all">Todos</button>
      </div>
      <div class="options" id="fCountry"></div>
    </div>
    <div class="group">
      <div class="group-head">
        <span data-i18n="f_bank">Banco</span>
        <button class="link" data-clear="bank" data-i18n="all">Todos</button>
      </div>
      <div class="options" id="fBank"></div>
    </div>
    <div class="group">
      <div class="group-head">
        <span data-i18n="f_sex">Sexo</span>
        <button class="link" data-clear="sex" data-i18n="all">Todos</button>
      </div>
      <div class="options" id="fSex"></div>
    </div>
    <div class="legend">
      <div class="lg"><span class="dot exact"></span><span data-i18n="lg_exact">Coordenada exacta (GPS)</span></div>
      <div class="lg"><span class="dot approx"></span><span data-i18n="lg_approx">Ubicación aproximada</span></div>
      <p class="note" data-i18n="lg_note">Cuando no se conoce la posición exacta, se usa el centroide de la región conocida más precisa.</p>
    </div>
  </aside>

  <div id="lightbox" class="lightbox" hidden>
    <button class="lb-close" id="lbClose" aria-label="Cerrar">&times;</button>
    <figure class="lb-fig">
      <img id="lbImg" alt="">
      <figcaption id="lbCap"></figcaption>
    </figure>
  </div>

  <script src="vendor/maplibre-gl.js"></script>
  <script src="vendor/supercluster.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
